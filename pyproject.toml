[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-speed-benchmark"
version = "0.2.0"
description = "Бенчмарк скорости стриминга LLM через vLLM (OpenAI-compatible API)"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Mikhail Utrobin", email = "utrobinmv@yandex.ru"},
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
bench_single = "llm_speed_benchmark.bench_single:cli"
bench_multi = "llm_speed_benchmark.bench_multi:cli"

[project.urls]
Homepage = "https://github.com/utrobinmv/llm-speed-benchmark"
Repository = "https://github.com/utrobinmv/llm-speed-benchmark"
Issues = "https://github.com/utrobinmv/llm-speed-benchmark/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
